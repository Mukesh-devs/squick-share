<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — SQuick Share</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/squick-share/assets/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/squick-share/assets/fonts/geist-latin.woff2") format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/squick-share/assets/fonts/jetbrains-mono-latin.woff2") format("woff2-variations");
        font-weight: 100 800;
      }
      :root {
        color-scheme: light dark;
        --page: #f6f7f9;
        --panel: #ffffff;
        --ink: #0b1020;
        --muted: #5b6475;
        --line: #dde1e8;
        --accent: #0066d6;
        --accent-hover: #0058c2;
        --accent-ink: #ffffff;
        --accent-soft: rgb(0 102 214 / 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #090c13;
          --panel: #10141e;
          --ink: #e9edf5;
          --muted: #98a0b0;
          --line: #222938;
          --accent: #3096ff;
          --accent-hover: #5aabff;
          --accent-ink: #090c13;
          --accent-soft: rgb(48 150 255 / 0.13);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        /* Discovery rings around the icon: no device here. */
        background:
          repeating-radial-gradient(
            circle at 50% 38%,
            transparent 0,
            transparent 76px,
            color-mix(in srgb, var(--accent) 14%, transparent) 77px,
            transparent 78px
          ),
          var(--page);
        color: var(--ink);
        font:
          17px/1.6 "Geist",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        display: grid;
        justify-items: center;
      }
      img {
        display: block;
      }
      p.code {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 26px 0 0;
        padding: 5px 12px 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font:
          600 12.5px/1.3 "JetBrains Mono",
          ui-monospace,
          monospace;
      }
      p.code i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f59e0b;
      }
      h1 {
        margin: 16px 0 8px;
        font-weight: 650;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1;
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 15px 22px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/squick-share/assets/icon.svg" width="112" height="112" alt="" />
      <p class="code"><i></i>404 · not found nearby</p>
      <h1>This page isn't here.</h1>
      <p>The link may be old, or the page has moved.</p>
      <a href="/squick-share/">Go to the SQuick Share home page</a>
    </main>
  </body>
</html>
